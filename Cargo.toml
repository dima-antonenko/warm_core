[package]
name = "warm_core"
version = "0.1.0"
edition = "2024"
description = "Пул потоков, который держит работу на физическом ядре, чтобы L1/L2 оставались тёплыми"
publish = false

[dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.5"
rayon = "1"

# Атомики очереди подменяются на loom, когда сборка идёт с `--cfg loom`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[bench]]
name = "locality"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
